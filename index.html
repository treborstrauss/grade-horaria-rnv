<style id="estilo">
:root{
  --ink:#1E2430; --ink2:#5B6475; --line:#DCE0E7; --bg:#E9ECF1; --panel:#FFFFFF; --soft:#F5F6F9;
  --brand:#FF5B00; --brand2:#FF9370; --ok:#1F9D6B; --warn:#C98A00; --err:#D6362F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#E8EBF1; --ink2:#A3ABBA; --line:#343A46; --bg:#15181E; --panel:#1E222A; --soft:#262B35; }
}
:root[data-theme="dark"]{ --ink:#E8EBF1; --ink2:#A3ABBA; --line:#343A46; --bg:#15181E; --panel:#1E222A; --soft:#262B35; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.45 'Proxima Nova',system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ---------- chrome ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.brandmark i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.vername{color:var(--ink2);font-weight:600}
.vername b{color:var(--ink)}
.status{display:flex;gap:6px;margin-left:4px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.chip.err{color:#fff;background:var(--err);border-color:var(--err)}
.chip.warn{color:#553b00;background:#FFE7A3;border-color:#F2CE63}
.chip.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;font-weight:700}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px}
.side h3{font-size:12px;color:var(--ink2);margin:14px 8px 6px;font-weight:700}
.side button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600}
.side button:hover{background:var(--soft)}
.side button.on{background:var(--brand);color:#fff}
.side .dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.stage{overflow:auto;padding:18px;position:relative}
.pgwrap{margin:0 auto;box-shadow:0 1px 2px rgba(20,30,50,.08),0 8px 30px rgba(20,30,50,.10);border-radius:6px;overflow:hidden;background:#fff}
.pgscale{transform-origin:0 0}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;background:none;padding:5px 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink2)}
.tabs button.on{background:var(--soft);border-color:var(--line);color:var(--ink)}
.pbody{overflow:auto;padding:14px 14px 40px;min-height:0;flex:1}
.pbody h4{margin:4px 0 4px;font-size:15px}
.pbody p.lead{margin:0 0 12px;color:var(--ink2);font-size:13px}
.issue{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:8px 10px;margin:0 0 8px;font-size:13px;background:var(--panel);cursor:pointer}
.issue.erro{border-left-color:var(--err)}
.issue.info{border-left-color:#8A94A6}
.issue small{display:block;color:var(--ink2);font-weight:700;font-size:11px;margin-bottom:2px}
.field{display:grid;gap:4px;margin:0 0 10px}
.field label{font-size:12px;font-weight:700;color:var(--ink2)}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 9px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.field{flex:1;min-width:90px}
.score{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
.score b{font-size:34px;font-family:Cocogoose,'Proxima Nova';line-height:1}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 14px}
table.mini td,table.mini th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{color:var(--ink2);font-size:11.5px}
.ver{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0 0 8px}
.ver .t{font-weight:800}
.ver .m{font-size:12px;color:var(--ink2)}
.badge{font-size:11px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.diff{font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;max-height:260px;overflow:auto}
.diff div{padding:2px 0}
.muted{color:var(--ink2)}
.agent{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.agent i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--soft);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.mobnav{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto}
  .side{display:none}
  .mobnav{display:block;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mobnav select{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--soft)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pbody{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- página da grade (1300 x 920, fiel ao original) ---------- */
.pg{position:relative;width:1300px;height:920px;background:#fff;overflow:hidden;font-family:'Proxima Nova',sans-serif;color:#1b1b1b;font-synthesis:none}
.pg .cg{font-family:Cocogoose,'Proxima Nova';font-weight:400}
.pg *{box-sizing:border-box}
.pg .a{position:absolute}
.pg .band{position:absolute;border-radius:13px}
.pg .rot{position:absolute;display:flex;align-items:center;justify-content:center;transform:rotate(-90deg);white-space:nowrap}
.pg .tl{position:absolute;text-align:center;font-family:Cocogoose,'Proxima Nova';font-weight:400;color:#141414;line-height:1}
.pg .card{position:absolute;border-radius:15px;border:4px solid #FF9370;padding:0 10px 0 13px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden}
.pg .card .ti{font-family:Cocogoose,'Proxima Nova';font-weight:400;font-size:11px;line-height:1.22;color:#161616}
.pg .card .su{font-family:Cocogoose,'Proxima Nova';font-weight:400;font-size:6.6px;line-height:1.1;color:#161616}
.pg .card .pr{font-weight:700;font-size:11.6px;line-height:1.2;margin-top:6px;color:#FF9370}

function regenerarDocumento(oficial){
  const dados=JSON.stringify(oficial).replace(/</g,'\\u003c');

  const fam=!!(oficial&&oficial.somenteFamilia);
  const desc=fam&&oficial.estado?`Grade horária oficial das turmas da ${oficial.estado.meta.unidade}.`:'';
  const extra=fam?'<meta name="description" content="'+esc(desc)+'">\n<meta name="robots" content="noindex, nofollow">\n<meta property="og:title" content="'+esc(titulo)+'">\n<meta property="og:description" content="'+esc(desc)+'">\n<meta name="theme-color" content="#FF5B00">\n':'';
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(titulo)+'</title>\n<link rel="icon" type="image/png" href="'+FAVICON+'">\n'+extra

}

/* =====================================================================
   MOTOR: interpreta os dados (aulas, horários, sobreposições)
   ===================================================================== */
function turmaById(st,id){return st.turmas.find(t=>t.id===id)}
function slotTimes(st,t,k){const a=st.regimes[t.regime].aulas[k];return [T(a[0]),T(a[1])]}
function durPadrao(t){return t.seg==='inf'?40:45}
function aulaDe(st,t,dia,k){
  const raw=t.aulas[dia][k]; const [si,sf]=slotTimes(st,t,k);
  if(raw==null) return null;
  if(typeof raw==='string') return {turma:t.id,dia,k,d:raw,p:null,esp:false,i:si,f:sf,sala:'turma',j:null,si,sf};
  const disc=st.disciplinas[raw.d]||{};
  let i=raw.i?T(raw.i):si, f=raw.f?T(raw.f):Math.min(sf,i+durPadrao(t));
  return {turma:t.id,dia,k,d:raw.d,p:raw.p||null,esp:!!raw.p,i,f,sala:raw.sala||disc.sala||'turma',j:raw.j||null,si,sf};
}
function aulasTurma(st,t){const out=[];for(let d=0;d<5;d++)for(let k=0;k<5;k++){const a=aulaDe(st,t,d,k);if(a)out.push(a)}return out}
function todasAulas(st){return st.turmas.flatMap(t=>aulasTurma(st,t))}
function sub(iv,cuts){ // subtrai intervalos
  let parts=[iv];
  for(const c of cuts){const n=[];for(const p of parts){if(c[1]<=p[0]||c[0]>=p[1]){n.push(p);continue}if(c[0]>p[0])n.push([p[0],c[0]]);if(c[1]<p[1])n.push([c[1],p[1]])}parts=n}
  return parts.filter(p=>p[1]-p[0]>0);
}
function visivel(st,t,a,todas){ // intervalo visível de uma aula da regente, recortado por especialistas
  if(a.esp) return [a.i,a.f];
  const cuts=todas.filter(b=>b.esp&&b.dia===a.dia&&b!==a).map(b=>[b.i,b.f]);
  const parts=sub([a.si,a.sf],cuts); if(!parts.length) return null;
  return parts.sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]))[0];
}
function eventosTurma(st,tid){return st.eventos.filter(e=>e.turmas.includes(tid))}
function nomeDisc(st,code,t){
  const d=st.disciplinas[code]; if(!d) return code;
  if(t&&t.seg==='inf'&&d.campo) return d.nome+' ('+d.campo+')';
  return d.nome;
}
function legendaDisc(st,code,t){const d=st.disciplinas[code];if(!d)return code;if(t.seg==='fund'&&d.legFund)return d.legFund;return nomeDisc(st,code,t)}
function nomeGrupo(st,ids){
  const ns=ids.map(id=>turmaById(st,id)?.nome||id);
  if(ns.length===1) return ns[0];
  const pre=ns.map(n=>n.slice(0,n.lastIndexOf(' ')));
  if(pre.every(p=>p===pre[0])) return pre[0]+' '+ns.map(n=>n.slice(n.lastIndexOf(' ')+1)).join(' e ');
  return ns.join(' + ');
}
function contagem(st,t){const c={};for(const a of aulasTurma(st,t)){c[a.d]=(c[a.d]||0)+1}return c}
function sessoesProf(st,pid){ // junta aulas conjuntas numa sessão só
  const as=todasAulas(st).filter(a=>a.p===pid); const map=new Map();
  for(const a of as){const key=a.j?('j:'+a.j):('a:'+a.turma+a.dia+a.k); if(!map.has(key))map.set(key,{...a,turmas:[a.turma]}); else map.get(key).turmas.push(a.turma)}
  return [...map.values()];
}

/* =====================================================================
   AGENTE TESTADOR: regras obrigatórias (erros e avisos)
   ===================================================================== */
function testar(st){
  const out=[]; const push=(sev,msg,ref,tipo)=>out.push({sev,msg,ref,tipo});
  const todas=todasAulas(st);
  const DN=d=>DIAS[d].toLowerCase();
  for(const t of st.turmas){
    const c=contagem(st,t);
    for(const code of new Set([...Object.keys(t.cota||{}),...Object.keys(c)])){
      const q=(t.cota||{})[code]||0, n=c[code]||0;
      if(q!==n) push('erro',`${t.nome}: ${st.disciplinas[code]?.nome||code} tem ${n} aula(s), a carga prevista é ${q}.`,{turma:t.id},'carga');
    }
    const R=st.regimes[t.regime]; const ini=T(R.aulas[0][0]), fim=T(R.aulas[4][1]); const itv=R.intervalo.map(T);
    for(const a of aulasTurma(st,t)){
      if(!st.disciplinas[a.d]) push('erro',`${t.nome}, ${DN(a.dia)}: disciplina desconhecida "${a.d}".`,{turma:t.id,dia:a.dia,k:a.k},'dado');
      if(a.f<=a.i) push('erro',`${t.nome}, ${DN(a.dia)}: horário inválido (${HM(a.i)}-${HM(a.f)}).`,{turma:t.id,dia:a.dia,k:a.k},'dado');
      if(a.esp){
        if(a.i<ini||a.f>fim) push('erro',`${t.nome}, ${DN(a.dia)}: ${nomeDisc(st,a.d)} fora do horário da turma.`,{turma:t.id,dia:a.dia,k:a.k},'horario');
        if(a.i<itv[1]&&a.f>itv[0]) push('erro',`${t.nome}, ${DN(a.dia)}: ${nomeDisc(st,a.d)} cai no intervalo.`,{turma:t.id,dia:a.dia,k:a.k},'horario');
        if(!st.profs[a.p]) push('erro',`${t.nome}: professor "${a.p}" não cadastrado.`,{turma:t.id,dia:a.dia,k:a.k},'dado');
        const dur=a.f-a.i, alvo=durPadrao(t);
        if(dur!==alvo && !(t.seg==='fund'&&a.d==='BAL'&&dur===40)) push('aviso',`${t.nome}, ${DN(a.dia)}: ${nomeDisc(st,a.d)} com ${dur} min (padrão ${alvo}).`,{turma:t.id,dia:a.dia,k:a.k},'duracao');
      }
      for(const b of todas){ if(b.turma===t.id&&b.dia===a.dia&&b!==a&&b.esp&&a.esp&&a.i<b.f&&b.i<a.f&&(a.k<b.k)) push('erro',`${t.nome}, ${DN(a.dia)}: duas aulas de especialista ao mesmo tempo.`,{turma:t.id,dia:a.dia,k:a.k},'turma') }
    }
  }
  // professores
  for(const pid of Object.keys(st.profs)){
    const P=st.profs[pid]; const ss=sessoesProf(st,pid);
    for(const s of ss){
      const dp=P.disp[s.dia];
      if(!dp) push('erro',`${P.nome} não tem disponibilidade na ${DN(s.dia)} (${nomeGrupo(st,s.turmas)}).`,{turma:s.turma,dia:s.dia,k:s.k},'disp');
      else if(s.i<T(dp[0])||s.f>T(dp[1])) push('erro',`${P.nome}: aula de ${nomeGrupo(st,s.turmas)} (${HM(s.i)}-${HM(s.f)}) fora da disponibilidade da ${DN(s.dia)}.`,{turma:s.turma,dia:s.dia,k:s.k},'disp');
    }
    for(let x=0;x<ss.length;x++)for(let y=x+1;y<ss.length;y++){const a=ss[x],b=ss[y];
      if(a.dia===b.dia&&a.i<b.f&&b.i<a.f) push('erro',`${P.nome} em dois lugares na ${DN(a.dia)}: ${nomeGrupo(st,a.turmas)} (${HM(a.i)}-${HM(a.f)}) e ${nomeGrupo(st,b.turmas)} (${HM(b.i)}-${HM(b.f)}).`,{turma:a.turma,dia:a.dia,k:a.k},'prof')}
  }
  // aulas conjuntas coerentes
  const js={}; for(const a of todas) if(a.j)(js[a.j]=js[a.j]||[]).push(a);
  for(const [j,as] of Object.entries(js)){const a0=as[0]; if(as.some(a=>a.dia!==a0.dia||a.i!==a0.i||a.f!==a0.f||a.p!==a0.p||a.d!==a0.d)) push('erro',`Aula conjunta ${j} com dados diferentes entre as turmas (dia, horário ou professor).`,{turma:a0.turma,dia:a0.dia,k:a0.k},'conj')}
  // sala de espelho
  const esp=[]; const vis=new Set(); for(const a of todas) if(a.sala==='espelho'){const key=a.j||(a.turma+a.dia+a.k); if(vis.has(key))continue; vis.add(key); esp.push(a)}
  for(let x=0;x<esp.length;x++)for(let y=x+1;y<esp.length;y++){const a=esp[x],b=esp[y];
    if(a.dia===b.dia&&a.i<b.f&&b.i<a.f) push('erro',`Sala de Espelho ocupada duas vezes na ${DN(a.dia)}: ${turmaById(st,a.turma).nome} ${nomeDisc(st,a.d)} e ${turmaById(st,b.turma).nome} ${nomeDisc(st,b.d)}.`,{turma:a.turma,dia:a.dia,k:a.k},'sala')}
  // brinquedão
  const br=st.eventos.filter(e=>e.tipo==='brinq');
  for(let x=0;x<br.length;x++)for(let y=x+1;y<br.length;y++){const a=br[x],b=br[y];
    if(a.dia===b.dia&&T(a.i)<T(b.f)&&T(b.i)<T(a.f)) push('erro',`Brinquedão com duas turmas na ${DN(a.dia)}: ${nomeGrupo(st,a.turmas)} (${a.i}-${a.f}) e ${nomeGrupo(st,b.turmas)} (${b.i}-${b.f}).`,{evento:a.id},'brinq')}
  for(const e of st.eventos){
    for(const tid of e.turmas){const t=turmaById(st,tid); if(!t){push('erro',`Evento ${e.id} aponta para turma inexistente ${tid}.`,{evento:e.id},'dado');continue}
      for(const a of aulasTurma(st,t)) if(a.esp&&a.dia===e.dia&&a.i<T(e.f)&&T(e.i)<a.f) push('erro',`${EV_NOME[e.tipo]} de ${t.nome} na ${DN(e.dia)} (${e.i}-${e.f}) bate com ${nomeDisc(st,a.d)} do especialista.`,{evento:e.id},'evento');
      const R=st.regimes[t.regime]; const itv=R.intervalo.map(T);
      if(e.tipo==='alt'&&T(e.i)<itv[1]&&T(e.f)>itv[0]) push('aviso',`Altitude de ${t.nome} invade o intervalo.`,{evento:e.id},'evento');
    }
  }
  return out;
}

/* =====================================================================
   AGENTE AVALIADOR: qualidade pedagógica (preferências com peso)
   ===================================================================== */
// Regra da escola: o evento vira recurso da aula (fica por cima) quando cai sobre a disciplina que ele complementa;
// nas demais, ele recorta a aula.
const INTEGRA_PADRAO={brinq:['PSI','SOC'],alt:['SEG','TT']};
function integra(st,code,tipo){const d=st.disciplinas[code]||{};if(Array.isArray(d.integra))return d.integra.includes(tipo);return (INTEGRA_PADRAO[tipo]||[]).includes(code)||(tipo==='alt'&&!!d.biblica)}
function modoRec(st){const m=st.meta.recorte;return m===true||m==='recorte'?'recorte':(m==='sobre'?'sobre':'auto')}
function recorta(st,e,code){const m=st.meta.recorte;if(m===true||m==='recorte')return true;if(m==='sobre')return false;return !integra(st,code,e.tipo)}
function avaliarTurma(st,t){
  const itens=[]; const add=(peso,msg,ref)=>itens.push({peso,msg,ref});
  const as=aulasTurma(st,t); const todas=as;
  for(let d=0;d<5;d++){
    const reg=as.filter(a=>a.dia===d&&!a.esp); const cnt={};
    reg.forEach(a=>{(cnt[a.d]=cnt[a.d]||[]).push(a.k)});
    for(const [code,ks] of Object.entries(cnt)) if(ks.length>1){
      const cons=ks.every((k,i)=>i===0||k===ks[i-1]+1);
      add(cons?1:3,`${DIAS[d]}: ${st.disciplinas[code]?.nome} ${ks.length}x no dia${cons?' (aula dupla)':' em horários separados'}.`,{turma:t.id,dia:d,k:ks[0]});
    }
  }
  const evs=eventosTurma(st,t.id);
  const nb=evs.filter(e=>e.tipo==='brinq').length; if(t.seg&&nb<5) add(1,`Brinquedão só ${nb}x na semana.`,{turma:t.id});
  for(const e of evs){
    const ei=T(e.i),ef=T(e.f);
    const under=as.filter(a=>a.dia===e.dia&&!a.esp).map(a=>({a,v:visivel(st,t,a,todas)})).filter(x=>x.v&&x.v[0]<ef&&ei<x.v[1]);
    for(const {a,v} of under){
      const disc=st.disciplinas[a.d]||{};
      if(integra(st,a.d,e.tipo)) continue;
      const min=Math.min(v[1],ef)-Math.max(v[0],ei);
      if(e.tipo==='alt') add(8,`Altitude recorta ${min} min de ${disc.nome}; o ideal é cair sobre a aula bíblica, que ela complementa.`,{evento:e.id});
      else if(a.d==='MUS') add(3,`Brinquedão recorta ${min} min de Musicalização na ${DIAS[e.dia].toLowerCase()}.`,{evento:e.id});
      else if(disc.biblica) add(2,`Brinquedão recorta ${min} min de ${disc.nome} na ${DIAS[e.dia].toLowerCase()}.`,{evento:e.id});
      else add(1,`Brinquedão recorta ${min} min de ${disc.nome} na ${DIAS[e.dia].toLowerCase()} (sobre Psicomotricidade ou Socioemocional ele vira recurso da aula).`,{evento:e.id});
    }
  }
  for(const a of as.filter(a=>!a.esp)){
    const v=visivel(st,t,a,todas); if(!v) continue; const len=v[1]-v[0];
    const cov=evs.filter(e=>e.dia===a.dia&&!integra(st,a.d,e.tipo)).map(e=>[Math.max(v[0],T(e.i)),Math.min(v[1],T(e.f))]).filter(x=>x[1]>x[0]).reduce((s,x)=>s+x[1]-x[0],0);
    if(len>0&&cov/len>=0.85) add(3,`${DIAS[a.dia]}: ${st.disciplinas[a.d]?.nome} fica praticamente sem tempo (${len-cov} min livres).`,{turma:t.id,dia:a.dia,k:a.k});
  }
  const pen=itens.reduce((s,x)=>s+x.peso,0);
  return {score:Math.max(0,100-pen),pen,itens:itens.sort((a,b)=>b.peso-a.peso)};
}
function avaliar(st){
  const turmas=st.turmas.map(t=>({t,...avaliarTurma(st,t)}));
  const profs=Object.entries(st.profs).map(([pid,P])=>{const ss=sessoesProf(st,pid);const dias=new Set(ss.map(s=>s.dia));
    let buracos=0; for(const d of dias){const l=ss.filter(s=>s.dia===d).sort((a,b)=>a.i-b.i);for(let x=1;x<l.length;x++){const g=l[x].i-l[x-1].f;if(g>15)buracos+=g}}
    return {pid,P,aulas:ss.length,dias:dias.size,buracos}});
  const media=Math.round(turmas.reduce((s,x)=>s+x.score,0)/turmas.length);
  return {turmas,profs,media};
}

/* =====================================================================
   AGENTE GERADOR: reorganiza as aulas da regente (busca local)
   ===================================================================== */
function reorganizarTurma(st,tid,iter=3000){
  const base=clone(st); const t=turmaById(base,tid);
  const livres=[]; for(let d=0;d<5;d++)for(let k=0;k<5;k++) if(typeof t.aulas[d][k]==='string') livres.push([d,k]);
  const orig=clone(t.aulas);
  const custo=s=>{const tt=turmaById(s,tid);let mud=0;for(const [d,k] of livres) if(tt.aulas[d][k]!==orig[d][k])mud++;return avaliarTurma(s,tt).pen+0.35*mud};
  let best=clone(base), bestC=custo(best);
  let cur=clone(base), curC=bestC;
  let rnd=1234567; const R=()=>(rnd=(rnd*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let it=0;it<iter;it++){
    const tt=turmaById(cur,tid); const a=livres[Math.floor(R()*livres.length)], b=livres[Math.floor(R()*livres.length)];
    if(a===b||tt.aulas[a[0]][a[1]]===tt.aulas[b[0]][b[1]]) continue;
    const tmp=tt.aulas[a[0]][a[1]]; tt.aulas[a[0]][a[1]]=tt.aulas[b[0]][b[1]]; tt.aulas[b[0]][b[1]]=tmp;
    const c=custo(cur); const temp=Math.max(0.02,1.5*(1-it/iter));
    if(c<=curC||R()<Math.exp((curC-c)/temp)){curC=c; if(c<bestC){bestC=c;best=clone(cur)}}
    else {tt.aulas[b[0]][b[1]]=tt.aulas[a[0]][a[1]]; tt.aulas[a[0]][a[1]]=tmp}
  }
  return best;
}

   AGENTE GERADOR (grade completa) E CENÁRIOS "E SE"
   Fase 1: especialistas | Fase 2: Brinquedão | Fase 3: aulas da regente

const slotsT=(st,t)=>st.regimes[t.regime].aulas.map(a=>[T(a[0]),T(a[1])]);
function reservadosT(st,t){const r=new Set();for(const e of st.eventos)if(e.tipo==='alt'&&e.turmas.includes(t.id)){const k=slotsT(st,t).findIndex(x=>T(e.i)>=x[0]&&T(e.i)<x[1]);if(k>=0)r.add(e.dia+'|'+k)}return r}
function derivarAtrib(st){
  const at={};

}

async function recozer(nVars,nCand,custo,x0,iters,rnd,prog){

  return {erros:e.filter(x=>x.sev==='erro').length,avisos:e.filter(x=>x.sev==='aviso').length,nota:A.media,
    dias:A.profs.reduce((s,p)=>s+p.dias,0),espera:A.profs.reduce((s,p)=>s+p.buracos,0),mudancas:ref?diffStates(ref,st).length:0};
}
async function listarCenarios(){
  if(Store.db){try{const q=await Store.db.collection(BASE+'/cenarios').orderBy('criadoEm','desc').limit(40).get();return q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}}

async function removerCenario(id){

   OPERAÇÕES (usadas pelo editor e pelo Agente de Prompt)
   ===================================================================== */
function normTurma(st,x){
  if(!x) throw new Error('turma não informada');
  const s=String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/NIVEL/g,'N').replace(/ANO/g,'').replace(/[^A-Z0-9]/g,'').replace(/^1O/,'1');
  const t=st.turmas.find(t=>t.id===s||t.id===String(x)); if(!t) throw new Error('turma desconhecida: '+x); return t;
}
function normDia(x){if(typeof x==='number')return x;const s=String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').slice(0,3);const i=['seg','ter','qua','qui','sex'].indexOf(s);if(i<0)throw new Error('dia inválido: '+x);return i}
function normAula(x){const k=(+x)-1;if(!(k>=0&&k<5))throw new Error('aula inválida: '+x);return k}
function aplicarOps(st,ops){
  const s=clone(st); const log=[];
  for(const o of (ops||[])){
    try{
      if(o.op==='trocar'){
        const t=normTurma(s,o.turma), t2=o.turma2?normTurma(s,o.turma2):t;
        const A=[normDia(o.a.dia),normAula(o.a.aula)], B=[normDia(o.b.dia),normAula(o.b.aula)];
        const x=t.aulas[A[0]][A[1]], y=t2.aulas[B[0]][B[1]];
        const limpa=v=>{if(typeof v==='string')return v;const c=clone(v);delete c.i;delete c.f;return c};
        t.aulas[A[0]][A[1]]=limpa(y); t2.aulas[B[0]][B[1]]=limpa(x);
      } else if(o.op==='definir'){
        const t=normTurma(s,o.turma); const d=normDia(o.dia), k=normAula(o.aula);
        if(!s.disciplinas[o.disc]) throw new Error('disciplina desconhecida: '+o.disc);
        if(o.prof){ if(!s.profs[o.prof]) throw new Error('professor desconhecido: '+o.prof);
          const v={d:o.disc,p:o.prof}; if(o.ini)v.i=o.ini; if(o.fim)v.f=o.fim; if(o.sala)v.sala=o.sala; if(o.conj)v.j=o.conj; t.aulas[d][k]=v;
        } else t.aulas[d][k]=o.disc;
      } else if(o.op==='evento'){
        if(o.acao==='remover'){const n=s.eventos.length; s.eventos=s.eventos.filter(e=>e.id!==o.id); if(s.eventos.length===n) throw new Error('evento não encontrado: '+o.id)}
        else if(o.acao==='mover'){const e=s.eventos.find(e=>e.id===o.id); if(!e) throw new Error('evento não encontrado: '+o.id); if(o.dia!=null)e.dia=normDia(o.dia); if(o.ini)e.i=o.ini; if(o.fim)e.f=o.fim; if(o.turmas)e.turmas=o.turmas.map(x=>normTurma(s,x).id)}
        else if(o.acao==='criar'){const tipo=o.tipo==='alt'?'alt':'brinq'; s.eventos.push({id:o.id||(tipo[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),tipo,turmas:(o.turmas||[]).map(x=>normTurma(s,x).id),dia:normDia(o.dia),i:o.ini,f:o.fim})}
        else throw new Error('ação de evento inválida');
      } else if(o.op==='disponibilidade'){
        const P=s.profs[o.prof]; if(!P) throw new Error('professor desconhecido: '+o.prof); const d=normDia(o.dia);
        P.disp[d]=(o.ini&&o.fim)?[o.ini,o.fim]:null;
      } else if(o.op==='cota'){
        const t=normTurma(s,o.turma); if(!s.disciplinas[o.disc]) throw new Error('disciplina desconhecida: '+o.disc);
        if(+o.n>0) t.cota[o.disc]=+o.n; else delete t.cota[o.disc];
      } else throw new Error('operação desconhecida: '+o.op);
    }catch(e){log.push('Não apliquei uma operação: '+e.message)}
  }
  return {s,log};
}
function diffStates(a,b){
  const out=[];
  for(const t of b.turmas){const ta=turmaById(a,t.id); if(!ta){out.push('Nova turma '+t.nome);continue}
    const nrm=(st0,tt,d,k)=>{const q=aulaDe(st0,tt,d,k);return q?[q.d,q.p,q.i,q.f,q.sala,q.j].join('|'):'-'};
    for(let d=0;d<5;d++)for(let k=0;k<5;k++){const x=nrm(a,ta,d,k),y=nrm(b,t,d,k); if(x!==y){
      const dsc=v=>{if(v==null)return 'vazio';if(typeof v==='string')return b.disciplinas[v]?.nome||v;return (b.disciplinas[v.d]?.nome||v.d)+' ('+(b.profs[v.p]?.nome||v.p)+(v.i?' '+v.i+'-'+v.f:'')+')'};
      out.push(`${t.nome}, ${DIAS[d].toLowerCase()}, aula ${k+1}: ${dsc(ta.aulas[d][k])} → ${dsc(t.aulas[d][k])}`)}}
    if(JSON.stringify(ta.cota)!==JSON.stringify(t.cota)) out.push(`${t.nome}: carga semanal alterada`);
  }
  const ek=e=>e.tipo+'|'+e.turmas.slice().sort().join()+'|'+e.dia;
  const ea=new Map(a.eventos.map(e=>[ek(e),e])), eb=new Map(b.eventos.map(e=>[ek(e),e]));
  for(const [id,e] of eb){const o=ea.get(id); const lab=`${EV_NOME[e.tipo]} ${nomeGrupo(b,e.turmas)}`;
    if(!o) out.push(`Novo: ${lab}, ${DIAS[e.dia].toLowerCase()} ${e.i}-${e.f}`);
    else if(o.i!==e.i||o.f!==e.f) out.push(`${lab}: ${DIAS[o.dia].toLowerCase()} ${o.i}-${o.f} → ${DIAS[e.dia].toLowerCase()} ${e.i}-${e.f}`)}
  for(const [id,e] of ea) if(!eb.has(id)) out.push(`Removido: ${EV_NOME[e.tipo]} ${nomeGrupo(a,e.turmas)}, ${DIAS[e.dia].toLowerCase()} ${e.i}-${e.f}`);
  for(const pid of Object.keys(b.profs)) if(JSON.stringify(a.profs[pid]?.disp)!==JSON.stringify(b.profs[pid].disp)) out.push(`Disponibilidade de ${b.profs[pid].nome} alterada`);
  return out;
}

function logoRenov(){return `<img class="a" alt="Renovação" src="${LOGO_REN}" style="left:67px;top:16px;width:91px">`}
function logoKids(){return `<img class="a" alt="Kids" src="${LOGO_KIDS}" style="left:1077px;top:30px;width:81px">`}
function cabecalho(st,pill,pillCor,sub,subCor){
  let h=logoRenov()+logoKids();
  h+=`<div class="a" style="left:0;width:1300px;top:${sub?14:28}px;text-align:center;font:900 33px 'Proxima Nova';color:#FF5B00;letter-spacing:-.005em">${esc(st.meta.titulo)}</div>`;
  if(sub) h+=`<div class="a" style="left:0;width:1300px;top:54px;text-align:center;font:600 18px 'Proxima Nova';color:${subCor}">${esc(sub)}</div>`;
  const small=pill.length>16&&!pill.includes('\n');
  h+=`<div class="a" style="left:18px;top:90px;width:188px;height:62px;border-radius:14px;background:${pillCor};color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:700 ${pill.includes('\n')?20:(small?18:(pill.length>11?21:26))}px/1.05 'Proxima Nova'">${esc(pill).replace(/\n/g,'<br>')}</div>`;
  DIAS.forEach((d,i)=>h+=`<div class="a" style="left:${222+200*i}px;top:90px;width:188px;height:62px;border-radius:14px;background:#FF9370;color:#fff;display:flex;align-items:center;justify-content:center;font:700 21.5px 'Proxima Nova'">${d}</div>`);
  return h;
}
function grade(){
  let h='';
  for(let d=0;d<=5;d++) h+=`<div class="a" style="left:${COLX(d)-1}px;top:160px;height:588px;border-left:2.5px dotted #D5D5D5"></div>`;
  for(let m=780;m<=1050;m+=30) h+=`<div class="a" style="left:216px;width:1000px;top:${Y(m)}px;border-top:2px dotted #E0E0E0"></div>`;
  h+=`<div class="a" style="left:216px;width:1000px;top:${Y(1050)+1}px;border-top:2.5px dotted #D5D5D5"></div>`;
  for(let m=780;m<=1050;m+=30){
    h+=`<div class="a" style="left:1222px;top:${Y(m)-8}px;font:600 11.5px 'Proxima Nova';color:#A6A6A6">&#8203;<span style="letter-spacing:.02em">&nbsp;&nbsp;${HM(m)}</span></div>`;
    h+=`<div class="a" style="left:1216px;top:${Y(m)}px;width:14px;border-top:2px dotted #CFCFCF"></div>`;
    if(m<1050) for(let q=1;q<4;q++) h+=`<div class="a" style="left:1226px;top:${Y(m+q*7.5)}px;width:6px;border-top:1.5px solid #BDBDBD"></div>`;
  }
  return h;
}
function faixasTurma(st,t){
  const R=st.regimes[t.regime]; const segs=R.aulas.map((a,k)=>({k,i:T(a[0]),f:T(a[1])}));
  segs.push({k:-1,i:T(R.intervalo[0]),f:T(R.intervalo[1])}); segs.sort((a,b)=>a.i-b.i);
  const fills={}; let h='', lab='';
  segs.forEach((s,idx)=>{
    const fill=idx%2?'#FEFCE3':'#FEEBD1'; if(s.k>=0) fills[s.k]=fill;
    const y=Y(s.i)+1.5, hh=Y(s.f)-Y(s.i)-3;
    h+=`<div class="band" style="left:22px;width:1190px;top:${y}px;height:${hh}px;background:${fill};${idx%2?'border:2.5px solid #FEF3D6':''}"></div>`;
    if(s.k<0){ lab+=`<div class="a" style="left:216px;width:1000px;top:${y+hh/2-14}px;height:28px;display:flex;align-items:center;justify-content:center"><span style="font:600 20px 'Proxima Nova';color:#3E3E3E;background:${fill};padding:0 10px;border-radius:6px">Intervalo</span></div>`; }
    else{
      h+=`<div class="rot" style="left:${48-hh/2}px;width:${hh}px;top:${y}px;height:${hh}px;font:900 20px 'Proxima Nova';color:#FF9370;letter-spacing:.01em">Aula ${s.k+1}</div>`;
      h+=`<div class="tl" style="left:62px;width:66px;top:${y+hh/2-23}px"><div style="font-size:17.5px">${HM(s.i)}</div><div style="font-size:10px;margin:0 0 1px">até</div><div style="font-size:17.5px">${HM(s.f)}</div></div>`;
    }
  });
  return {h,fills,lab};
}
function cardHtml(st,t,a,v,fill,ctx){
  const d=st.disciplinas[a.d]||{nome:a.d}; const y=Y(v[0])+4, hh=Y(v[1])-Y(v[0])-8; const x=COLX(a.dia)+8, w=188;
  const dataAttr=`data-t="${a.turma}" data-d="${a.dia}" data-k="${a.k}"`;
  const selCls=(ctx.sel&&ctx.sel.turma===a.turma&&ctx.sel.dia===a.dia&&ctx.sel.k===a.k)?' sel':'';
  const swapCls=(ctx.swap&&ctx.swap.turma===a.turma&&ctx.swap.dia===a.dia&&ctx.swap.k===a.k)?' swapsrc':'';
  const badCls=ctx.bad&&ctx.bad.has(a.turma+'|'+a.dia+'|'+a.k)?' bad':'';
  const xs=hh<30?' xs xxs x3':(hh<40?' xs xxs':(hh<58?' xs':''));
  const titulo=t.seg==='inf'?((d.curto||d.nome)+(d.campo?' ('+d.campo+')':'')):(d.curto||d.nome);
  const subl=(t.seg==='fund'&&d.sub)?`<div class="${d.subPeq?'su':'ti'}">${esc(d.sub)}</div>`:'';
  if(a.esp){
    const E=ESTILO[d.estilo]||ESTILO.ing; const P=st.profs[a.p]||{nome:a.p};
    const pn=(t.seg==='fund'&&a.p==='marcelo')?'prof. '+P.nome:'Prof. '+(P.curto&&t.seg==='inf'?P.curto:P.nome);
    return `<div class="card esp${xs}${selCls}${swapCls}${badCls}" ${dataAttr} style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;background:${E.fill};border-color:${E.stroke}"><div class="hr">${HM(a.i)} às ${HM(a.f)}</div><div class="ti">${esc(titulo)}</div><div class="pr">${esc(pn)}</div><div class="du" style="color:${E.du}">${a.f-a.i}'</div></div>`;
  }
  return `<div class="card${xs}${selCls}${swapCls}${badCls}" ${dataAttr} style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;background:${fill}"><div class="ti">${esc(titulo)}</div>${subl}<div class="pr">Prof. ${esc(t.regente)}</div></div>`;
}
function overlaysTurma(st,t,ctx){

  const arr=LS.get('gradeKids.versoes')||[]; arr.forEach(v=>{if(v.id===id)v.oficial=true}); LS.set('gradeKids.versoes',arr);
}

async function rodarCenario(seed){
  if(S.gen.rodando)return;S.gen={rodando:true,prog:0,fase:'Preparando'};S.proposta=null;render();
  const cen={...clone(S.cen),seed:seed||S.cen.seed||7};
  let ult=0;
  try{
    const r=await gerarCenario(S.st,cen,(fase,f)=>{S.gen.fase=fase;S.gen.prog=f;const now=performance.now();if(now-ult>250){ult=now;const pb=document.getElementById('pbody');if(pb&&S.tab==='gerador'){const sc=pb.scrollTop;pb.innerHTML=painel(testar(S.st));pb.scrollTop=sc}}});
    const metA=metricas(S.st),metB=metricas(r.s,S.st);
    const inviavel=r.log.some(x=>/Não existe grade sem conflito/.test(x));
    const txt=`${cen.modo==='zero'?'Grade montada do zero':(cen.modo==='otimizar'?'Grade melhorada a partir da atual':'Grade ajustada a partir da atual, mudando o mínimo')}${cen.mud.length?` com ${cen.mud.length} mudança${cen.mud.length>1?'s':''}`:''} em ${(r.ms/1000).toFixed(1)} s. `+(metB.erros?(inviavel?`Este cenário não fecha: falta horário para um especialista, então ficaram ${metB.erros} conflito(s). Veja o motivo abaixo.`:`Ficaram ${metB.erros} conflito(s). Tente gerar outra alternativa ou afrouxe uma restrição.`):'Nenhum conflito.');
    S.proposta={origem:'cenario',s:r.s,log:r.log,diff:diffStates(S.st,r.s),texto:txt,obs:'',metA,metB,cen};
  }catch(e){S.proposta=null;toast('O gerador encontrou um problema: '+(e.message||e))}
  S.gen={rodando:false,prog:1,fase:''};render();
}

function estadoCompacto(st){
  const L=[];
  L.push('DISCIPLINAS: '+Object.entries(st.disciplinas).map(([k,d])=>`${k}=${d.nome}${d.campo?'('+d.campo+')':''}`).join('; '));
  L.push('ESPECIALISTAS (id: disciplina | disponibilidade):');
  for(const [k,p] of Object.entries(st.profs)) L.push(`  ${k}: ${p.nome}, ${p.disc} | ${p.disp.map((d,i)=>DIA_CURTO[i]+' '+(d?d[0]+'-'+d[1]:'não')).join(', ')}`);
  L.push('TURMAS:');
  for(const t of st.turmas){const R=st.regimes[t.regime];
    L.push(`${t.id} "${t.nome}" regente ${t.regenteCompleto}; aulas: ${R.aulas.map((a,k)=>(k+1)+'='+a[0]+'-'+a[1]).join(' ')}; intervalo ${R.intervalo.join('-')}; carga: ${Object.entries(t.cota).map(([k,v])=>k+v).join(' ')}`);
    for(let d=0;d<5;d++) L.push(`  ${DIA_CURTO[d]}: `+t.aulas[d].map((v,k)=>{if(typeof v==='string')return (k+1)+' '+v;const a=aulaDe(st,t,d,k);return `${k+1} ${v.d}[${v.p} ${HM(a.i)}-${HM(a.f)}${a.sala!=='turma'?' sala:'+a.sala:''}${v.j?' conj:'+v.j:''}]`}).join(' | '));
  }
  L.push('EVENTOS (id tipo turmas dia início-fim):');
  for(const e of st.eventos) L.push(`  ${e.id} ${e.tipo} ${e.turmas.join('+')} ${DIA_CURTO[e.dia]} ${e.i}-${e.f}`);
  return L.join('\n');
}

PEDIDO DO DIRETOR
${texto}`;
  const ferramenta={name:'testar_operacoes',description:'Aplica as operações numa cópia da grade e devolve os erros obrigatórios resultantes e a nota de qualidade. Não altera a grade real.',
    inputSchema:{type:'object',properties:{ops:{type:'array',items:{type:'object'}}},required:['ops']},
    execute:(input)=>{const {s,log}=aplicarOps(S.st,input.ops||[]);const antes=new Set(testar(S.st).map(x=>x.msg));const errs=testar(s).filter(x=>x.sev==='erro');
      return {erros_novos:errs.filter(x=>!antes.has(x.msg)).map(x=>x.msg).slice(0,15),erros_total:errs.length,nota_media:avaliar(s).media,avisos_aplicacao:log,mudancas:diffStates(S.st,s).slice(0,30)}}};
  const TIER_NOME={quick:'modelo rápido',default:'modelo equilibrado',complex:'modelo mais capaz (raciocínio longo)'};
  const errosAntes=new Set(testar(S.st).filter(x=>x.sev==='erro').map(x=>x.msg));
  const extrair=txt=>{const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw {code:'invalid_json'};return JSON.parse(txt.slice(a,b+1))};
  async function chamar(tier,extra){
    const inp=extra?prompt+'\n\n'+extra:prompt;
    S.ia.status=`Consultando o ${TIER_NOME[tier]}...`; render();
    let res;
    try{ res=await Store.sample(inp,{tools:[ferramenta],modelTier:tier,cache:false}) }
    catch(e){ if(e&&(e.code==='not_granted'||e.code==='rate_limited'||e.code==='cancelled')) throw e; res=await Store.sample(inp,{modelTier:tier,cache:false}) }
    const r=extrair(res.text||''); r._tier=res.modelTierApplied||tier; return r;
  }
  const precisaEscalar=r=>{
    if(!r) return 'a resposta não veio em formato válido';
    const {s,log}=aplicarOps(S.st,r.ops||[]);
    const novos=testar(s).filter(x=>x.sev==='erro'&&!errosAntes.has(x.msg));
    if(log.length) return 'algumas operações não puderam ser aplicadas';
    if(novos.length) return `a proposta criava ${novos.length} erro(s) novo(s)`;
    return null;
  };
  let r=null, motivo=null;
  const modo=S.ia.modo||'auto';
  try{
    if(modo==='complex') r=await chamar('complex');
    else{
      try{ r=await chamar('default') }catch(e){ if(e&&(e.code==='not_granted'||e.code==='rate_limited'||e.code==='cancelled')) throw e; r=null }
      motivo=precisaEscalar(r);
      if(motivo&&modo==='auto'){
        const antes=r?`TENTATIVA ANTERIOR (rejeitada porque ${motivo}): ${JSON.stringify(r.ops||[]).slice(0,4000)}. Corrija isso.`:'';
        r=await chamar('complex',antes); r._escalou=motivo;
      }
    }
  }catch(e){
    if(e&&e.code==='not_granted') S.ia.erro='A IA precisa da sua permissão. Tente de novo e aceite o pedido de consentimento.';
    else if(e&&e.code==='rate_limited') S.ia.erro='Muitos pedidos seguidos. Espere um pouco e tente de novo.';
    else if(e&&e.code==='cancelled') S.ia.erro='Pedido cancelado.';
    else S.ia.erro='Não consegui interpretar a resposta da IA ('+((e&&(e.code||e.message))||'erro')+'). Tente reformular o pedido.';
  }
  S.ia.busy=false; S.ia.status=null;
  if(r){
    const {s,log}=aplicarOps(S.st,r.ops||[]);
    const quem=`Respondido pelo ${TIER_NOME[r._tier]||r._tier}`+(r._escalou?`, depois de escalar porque ${r._escalou}.`:'.');
    S.proposta={origem:'ia',s,log,diff:diffStates(S.st,s),texto:r.entendi||'',obs:[r.observacoes||'',quem].filter(Boolean).join(' '),pergunta:r.pergunta||null};
    S.ia.hist.push({p:texto,r:(r.entendi||'')+(r.pergunta?' Pergunta: '+r.pergunta:'')});
  }
  render();
}

function hojeIdx(){const d=new Date().getDay();return d>=1&&d<=5?d-1:0}
function itensDoDia(st,t,dia){
  const todas=aulasTurma(st,t);const itens=[];
  for(const a of todas.filter(a=>a.dia===dia)){let v=visivel(st,t,a,todas);if(!v)continue;
    if(!a.esp){const cuts=eventosTurma(st,t.id).filter(e=>e.dia===dia&&recorta(st,e,a.d)).map(e=>[T(e.i),T(e.f)]);const parts=sub(v,cuts).filter(p=>p[1]-p[0]>=10).sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]));if(parts.length)v=parts[0]}
    itens.push({tipo:'aula',i:v[0],f:v[1],a})}
  for(const e of eventosTurma(st,t.id).filter(e=>e.dia===dia)){const sob=todas.find(a=>a.dia===dia&&!a.esp&&a.si<=T(e.i)&&T(e.i)<a.sf);itens.push({tipo:e.tipo,i:T(e.i),f:T(e.f),e,junto:sob&&integra(st,sob.d,e.tipo)?sob:null})}
  const R=st.regimes[t.regime];itens.push({tipo:'int',i:T(R.intervalo[0]),f:T(R.intervalo[1])});
  return itens.sort((x,y)=>x.i-y.i||(x.tipo==='aula'?-1:1));
}

  h+=`</main><div class="ffoot">Grade oficial da ${esc(st.meta.unidade)}. Mudanças aparecem aqui assim que a coordenação publica.</div>`;

async function atualizarPaginaFamilias(file){

    const er=testar(est).filter(x=>x.sev==='erro').length; if(er){S.famMsg=`Essa grade tem ${er} conflito(s). Resolva na gestão antes de publicar.`;renderFamilia();return}
    if(!Store.artifact){S.famMsg='A atualização não está disponível nesta visualização.';renderFamilia();return}
    S.famMsg='Publicando...';renderFamilia();

function paginasPacote(tipo){
  const all=listaPaginas(S.st).map(p=>p.id);
  if(tipo==='turmas') return all.filter(x=>x.startsWith('t:'));
  if(tipo==='profs') return all.filter(x=>x.startsWith('p:'));
  if(tipo==='pdf1') return [S.page];
  if(tipo==='individuais') return all.filter(x=>x.startsWith('t:')||x.startsWith('p:'));
  return all;
}

async function salvarArquivo(nome,data){
  if(Store.downloads){
    try{const r=await Store.downloads.save({filename:nome,data});if(r&&r.status==='saved')toast('Arquivo salvo.');return}
    catch(e){const c=e&&e.code;
      if(c==='declined')return;
      if(c==='rate_limited'){toast('Já existe um pedido de download aberto. Conclua e tente de novo.');return}
      if(c==='extension_not_enabled'||c==='rejected_extension'){toast('Este formato de arquivo não está liberado nesta visualização.');return}
      if(c==='too_large'){toast('O arquivo ficou grande demais. Escolha a qualidade Leve.');return}}}
  try{const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000)}
  catch(e){toast('Não consegui salvar o arquivo.')}
}

function addPagina(pdf,cv,primeira){if(!primeira)pdf.addPage('a4','landscape');const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();const r=Math.min(W/1300,H/920);const w=1300*r,h=920*r;
  pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',(W-w)/2,(H-h)/2,w,h,undefined,'FAST')}
async function exportarPDF(ids,nome,st){
  if(!window.jspdf||!window.html2canvas){toast('O gerador de PDF não carregou. Recarregue a página e tente de novo.');return}
  const q=S.expQ||2.5;const pdf=novoPDF();

    await salvarArquivo(nome+'.pdf',pdf.output('blob'))}

async function exportarZIP(ids){

    if(!S.page.startsWith('t:')){S.page='t:'+r.turma;S.sel=r;S.tab='editar';render();return}
    if(S.swap){const a=S.swap;S.swap=null;
      if(a.turma===r.turma&&a.dia===r.dia&&a.k===r.k){render();return}
      const {s}=aplicarOps(S.st,[{op:'trocar',turma:a.turma,turma2:r.turma,a:{dia:a.dia,aula:a.k+1},b:{dia:r.dia,aula:r.k+1}}]);
      S.sel=r; mudar(s,'Aulas trocadas.');return}
    S.sel=r;S.selEv=null;S.tab='editar';render();return}
  if(el.classList.contains('ov')&&el.closest('#pgscale')){S.selEv=el.dataset.ev;S.sel=null;S.tab='editar';render();return}
  if(el.dataset.exp){const x=el.dataset.exp;
    if(x==='png') return exportarPNG();
    if(x==='json') return salvarArquivo(`grade-${S.st.meta.grade}-${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(S.st,null,1)],{type:'application/json'}));
    if(x==='zip') return exportarZIP(paginasPacote('individuais'));
    const nomes={pdf1:nomeArq(S.page),all:`Grade Horaria ${S.st.meta.ano} - ${S.st.meta.unidade}`,turmas:`Grade Horaria ${S.st.meta.ano} - Turmas`,profs:`Grade Horaria ${S.st.meta.ano} - Especialistas`};

  if(el.dataset.cdel){await removerCenario(el.dataset.cdel);toast('Cenário excluído.');carregarCenarios();return}
  if(el.dataset.vdel){if(S.modo!=='admin')return;try{await Store.db.collection(BASE+'/versoes').doc(el.dataset.vdel).delete();registrar('Excluiu uma versão')}catch(e){const a=(LS.get('gradeKids.versoes')||[]).filter(v=>v.id!==el.dataset.vdel);LS.set('gradeKids.versoes',a)}toast('Versão excluída.');carregarVersoes();return}

  if(el.dataset.voff){await marcarOficial(el.dataset.voff);toast('Marcada como oficial.');carregarVersoes();return}
  const id=el.id;
  if(id==='bPub'){S.tab='versoes';S.confPub=true;render();return}
  if(id==='pubIr'){S.confPub=true;render();return}
  if(id==='pubNo'){S.confPub=false;render();return}
  if(id==='pubOk'){publicarFamilias();return}
  if(id==='verFam'){S.pub=(S.publicacao&&S.publicacao.dados)?JSON.parse(S.publicacao.dados):clone(S.st);S.modo='familia';render();return}
  if(id==='admPub'){const d=S.publicacao&&S.publicacao.dados?JSON.parse(S.publicacao.dados):(OFICIAL&&OFICIAL.estado);if(d){mudar(clone(d),'Rascunho restaurado para a versão publicada.');S.vername=(S.publicacao&&S.publicacao.nome)||S.vername;registrar('Restaurou o rascunho para a versão publicada')}return}
  if(id==='pub2Ok'){S.pubPasso2=false;render();return}
  if(id==='baixarFamHtml'){const pb=S.publicacao&&S.publicacao.dados;const est=pb?JSON.parse(S.publicacao.dados):S.st;const nm=pb?S.publicacao.nome:(S.vername||'').replace(/ \(editando\)$/,'');
    salvarArquivo('index.html',new Blob([paginaFamiliasHTML(est,nm,pb?S.publicacao.quando:Date.now())],{type:'text/html'}));toast(pb?`Página gerada com a versão publicada "${nm}".`:'Ainda não há publicação: a página foi gerada com a grade atual.');return}
  if(id==='bRecarregar'){S.aviso=null;S.pendente=false;clearTimeout(saveTimer);try{const sn=await Store.db.doc(BASE+'/rascunho/atual').get();const d=sn.data();S.st=JSON.parse(d.dados);S.vername=d.vername||S.vername;S.ultimaSync=d.atualizadoEm}catch(e){}render();return}
  if(id==='bManter'){S.aviso=null;agendarRascunho();render();return}
  if(id==='bUndo'){if(S.undo.length){S.st=S.undo.pop();agendarRascunho();render();toast('Alteração desfeita.')}return}
  if(id==='bSave'){S.tab='versoes';render();setTimeout(()=>document.getElementById('vNome')?.focus(),50);return}
  if(id==='bExport'){S.tab='exportar';render();return}
  if(id==='eClear'){S.sel=null;S.selEv=null;S.swap=null;render();return}
  if(id==='eSwap'){S.swap=S.sel;render();toast('Agora clique na aula para trocar.');return}
  if(id==='eApply'){const t=turmaById(S.st,S.sel.turma);const disc=document.getElementById('eDisc').value,prof=document.getElementById('eProf').value;
    const op={op:'definir',turma:t.id,dia:S.sel.dia,aula:S.sel.k+1,disc};
    if(prof){op.prof=prof;const i=document.getElementById('eIni').value,f=document.getElementById('eFim').value,sa=document.getElementById('eSala').value,cj=document.getElementById('eConj').value.trim();if(i&&f){op.ini=i;op.fim=f}if(sa&&sa!==(S.st.disciplinas[disc].sala||'turma'))op.sala=sa;if(cj)op.conj=cj}
    const {s,log}=aplicarOps(S.st,[op]); if(log.length) toast(log[0]); else mudar(s,'Aula atualizada.');return}
  if(id==='vApply'){const {s,log}=aplicarOps(S.st,[{op:'evento',acao:'mover',id:S.selEv,dia:+document.getElementById('vDia').value,ini:document.getElementById('vIni').value,fim:document.getElementById('vFim').value}]);if(log.length)toast(log[0]);else mudar(s,'Evento atualizado.');return}
  if(id==='vDel'){const {s}=aplicarOps(S.st,[{op:'evento',acao:'remover',id:S.selEv}]);S.selEv=null;mudar(s,'Evento removido.');return}
  if(id==='nAdd'){const {s,log}=aplicarOps(S.st,[{op:'evento',acao:'criar',tipo:document.getElementById('nTipo').value,turmas:[document.getElementById('nTurma').value],dia:+document.getElementById('nDia').value,ini:document.getElementById('nIni').value,fim:document.getElementById('nFim').value}]);if(log.length)toast(log[0]);else mudar(s,'Evento criado.');return}
  if(id==='gGo'){const tid=document.getElementById('gTurma').value; toast('Gerando proposta...');
    setTimeout(()=>{let s=S.st; const ids=tid==='*'?S.st.turmas.map(t=>t.id):[tid]; for(const x of ids) s=reorganizarTurma(s,x);
      S.proposta={origem:'gerador',s,log:[],diff:diffStates(S.st,s),texto:tid==='*'?'Reorganizei as aulas da regente em todas as turmas.':`Reorganizei as aulas da regente de ${turmaById(S.st,tid).nome}.`,obs:''}; render()},30);return}
  if(id==='cGo'){rodarCenario(S.cen.seed||7);return}
  if(id==='cOutra'){S.cen.seed=(S.cen.seed||7)+101;rodarCenario(S.cen.seed);return}
  if(id==='cSalvar'){const nome=(document.getElementById('cNome')?.value||'').trim()||(S.cen.mud.length?descrMud(S.st,S.cen.mud[0]):'Cenário de '+new Date().toLocaleDateString('pt-BR'));const P=S.proposta;const res=S.preview&&S._stBackup?S.st:P.s;if(await salvarCenario(nome||'Cenário',P.cen||S.cen,res,P.metB)){toast('Cenário salvo.');carregarCenarios()}return}
  if(id==='mAdd'){const v=x=>document.getElementById(x)?.value;const t=S.cen.tipo||'disp';let m=null;
    if(t==='disp')m={tipo:'disp',prof:v('mProf'),dia:+v('mDia'),ini:document.getElementById('mInd').checked?null:v('mIni'),fim:document.getElementById('mInd').checked?null:v('mFim')};
    if(t==='carga')m={tipo:'carga',turma:v('mTurma'),disc:v('mDisc'),n:+v('mN')};
    if(t==='atribuir')m={tipo:'atribuir',turma:v('mTurma'),disc:v('mDisc'),prof:v('mProf')||null};
    if(t==='separar'){if(!v('mGrupo'))return;m={tipo:'separar',grupo:v('mGrupo')}}
    if(t==='juntar'){if(v('mT1')===v('mT2')){toast('Escolha duas turmas diferentes.');return}m={tipo:'juntar',turmas:[v('mT1'),v('mT2')],disc:v('mDisc')}}
    if(t==='novaTurma'){const id=(v('mId')||'').trim().toUpperCase(),nome=(v('mNome')||'').trim(),reg=(v('mReg')||'').trim();if(!id||!nome||!reg){toast('Preencha código, nome e regente.');return}m={tipo:'novaTurma',base:v('mBase'),id,nome,regente:reg}}
    if(t==='fixar')m={tipo:'fixar',prof:v('mProf')};
    if(m){S.cen.mud.push(m);render()}return}
  if(id==='iaGo'){const t=document.getElementById('iaTxt').value.trim(); if(t) pedirIA(t); return}
  if(id==='pApply'){const s=S.proposta.s;S.proposta=null;S.preview=false;mudar(s,'Proposta aplicada.');return}
  if(id==='pDrop'){S.proposta=null;S.preview=false;if(S._stBackup){S.st=S._stBackup;S._stBackup=null}render();return}
  if(id==='pView'){ if(!S.preview){S._stBackup=S.st;S.st=S.proposta.s;S.preview=true}else{S.st=S._stBackup;S._stBackup=null;S.preview=false} const p=S.proposta; render(); S.proposta=p; return}
  if(id==='vSalvar'){const nome=document.getElementById('vNome').value.trim()||('Versão de '+new Date().toLocaleDateString('pt-BR'));const ok=await salvarVersao(nome,document.getElementById('vNota').value.trim(),document.getElementById('vOf').checked);if(ok){S.vername=nome;agendarRascunho();toast('Versão salva.');render()}return}
  if(id==='vBase'){registrar('Voltou para a grade base 2026');mudar(clone(SEED),'Grade base 2026 restaurada.');S.vername='Grade 2026 (base)';render();return}
});
document.addEventListener('change',ev=>{
  const tg=ev.target.id;
  if(tg==='famArq'){const f=ev.target.files[0];if(f)atualizarPaginaFamilias(f);return}
  if(tg==='cfgBloq'||tg==='cfgIa'||tg==='cfgGer'){const n={bloqueado:document.getElementById('cfgBloq').checked,ia:document.getElementById('cfgIa').checked,gerador:document.getElementById('cfgGer').checked};
    S.cfg=n;render();if(Store.db){Store.db.doc('config/'+SEED.meta.grade).set(n).then(()=>registrar(`Controles da equipe: edição ${n.bloqueado?'congelada':'liberada'}, IA ${n.ia?'liberada':'bloqueada'}, Gerador ${n.gerador?'liberado':'bloqueado'}`)).catch(()=>toast('Não consegui salvar os controles.'))}return}
  if(tg==='expQ'){S.expQ=+ev.target.value;return}
  if(tg==='apRec'){const n=clone(S.st);n.meta.recorte=ev.target.value;mudar(n,'Aparência atualizada.');return}
  if(tg==='cTipo'){S.cen.tipo=ev.target.value;render();return}
  if(tg==='cModo'){S.cen.modo=ev.target.value;return}
  if(tg==='cConc'){S.cen.opc.concentrar=ev.target.checked;return}
  if(tg==='cSexta'){S.cen.opc.sextaLivre=ev.target.checked;return}
  if(ev.target.id==='iaModo'){S.ia.modo=ev.target.value;LS.set('gradeKids.iaModo',S.ia.modo)}
  if(ev.target.id==='mobsel'){S.page=ev.target.value;S.sel=null;render()}
  if(ev.target.id==='impJson'){const f=ev.target.files[0];if(!f)return;f.text().then(tx=>{try{const d=JSON.parse(tx);if(!d.turmas||!d.regimes)throw 0;mudar(d,'Grade importada.')}catch(e){toast('Arquivo inválido: não é um backup de grade.')}})}
});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'&&!/input|textarea/i.test(ev.target.tagName)){ev.preventDefault();document.getElementById('bUndo').click()}});
window.addEventListener('resize',escala);
// a visualização da proposta não deve ficar ativa ao aplicar outra coisa
const _mudar=mudar; mudar=function(n,m){if(S.preview&&S._stBackup){S.st=S._stBackup;S._stBackup=null;S.preview=false}_mudar(n,m)};
render();
initRuntime();
</script>
